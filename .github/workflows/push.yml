name: push

on:
  push:
    branches:
      - '**'
  pull_request:

env:
  # Имя образа можно переопределить переменной репозитория DOCKERHUB_IMAGE
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'kicha3007boop/docker-project-74' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Публикация включается, только когда в репозитории заданы секреты
      # DOCKERHUB_USERNAME и DOCKERHUB_TOKEN; без них workflow только проверяет
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfiles
        run: make lint-dockerfiles

      # Сборка продакшен-образа, линтер и тесты приложения внутри Docker Compose
      - name: Lint and test in Docker
        run: make ci

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/setup-buildx-action@v4

      - name: Build and push production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.production
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
